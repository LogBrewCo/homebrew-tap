# Tool matrix: every gate, guard, and quality tool this repository runs, with its
# version, checksum, rules, conflicts, exceptions, runtime, findings, and the date
# its releases, advisories, and rules were last checked. scripts/check-tool-matrix.sh
# enforces it (see its header); the Tool matrix workflow runs that check.
#
# Runtimes come from GitHub Actions step timings since 2026-09-19 on ubuntu-24.04.
# Every run starts from an empty runner. p99 needs 100 runs; below that an entry
# gives the run count and the maximum.
# Format: one `key = value` per line, arrays on one line, pins as "file::text"
# where @VERSION@ stands for the entry's version. `uses` lists actions by name; the
# workflows hold each pin (a full commit and a version comment).
#
# Open gap: Formula/logbrew.rb is not linted. `brew style` and `brew audit` are the
# official Homebrew checkers; adding them needs a macOS or Linux Homebrew runner.

gates = []
utilities = ["[[", "git", "gh", "printf", "set"]

[[tool]]
id = "public-guard"
risk = "secrets or non-public text in commits, paths, branch names, pull request text, and formula updates; tracked Markdown that users do not need"
tool = "gitleaks with the public guard rules"
version = "8.30.1"
pins = ["scripts/public-guard.sh::readonly gitleaks_version=\"@VERSION@\"", "scripts/public-guard.sh::e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080", "scripts/public-guard.sh::551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"]
commands = ["scripts/public-guard.sh", "scripts/test-public-guard.sh"]
runs_in = "Public guard workflow (required status); formula update branches are scanned before they fast-forward main"
config = "scripts/public-guard.toml"
conflicts = "none known"
exceptions = "false positives are fixed in their own pull request"
runtime = "scan n=4, max 5 s; formula promotion n=6, max 6 s; self-test n=4, max 29 s; p99 unsupported"
findings = "unknown: findings are fixed before merge"
replaces = "none"
checked = 2026-10-19

[[tool]]
id = "actions-checkout"
risk = "CI source checkout supply chain"
tool = "actions/checkout"
version = "pinned in the workflows"
unpinned = "each workflow pins the commit with a version comment; the check requires one such pin per action"
uses = ["actions/checkout"]
runs_in = "every workflow"
config = "persist-credentials: false where the job needs no push"
conflicts = "none known"
exceptions = "none"
runtime = "at most 3 s per run"
findings = "not a check; supply-chain pin"
replaces = "none"
checked = 2026-10-19

[[tool]]
id = "tool-matrix"
risk = "a gate tool without an entry, a pin that differs from its entry, an entry not checked for 30 days"
tool = "scripts/check-tool-matrix.sh and its seeded tests"
version = "repository"
unpinned = "repository script, versioned by commit"
commands = ["scripts/check-tool-matrix.sh", "scripts/test-check-tool-matrix.sh"]
runs_in = "Tool matrix workflow on every pull request and push to main"
config = "this file"
conflicts = "reads commands with a small shell reader; a command built at run time is invisible to it"
exceptions = "none"
runtime = "new; record from CI runs at the next check"
findings = "seeded: an unlisted command, a changed pin, a changed action commit, a stale or future date, and a missing field each fail"
replaces = "none"
checked = 2026-10-19

[[tool]]
id = "openssf-scorecard"
risk = "Supply chain practices drifting: unpinned actions, write tokens, branch protection, dangerous workflows"
tool = "OpenSSF Scorecard action and the CodeQL SARIF upload"
version = "pinned in the workflows"
unpinned = "the scorecard workflow pins each action to a commit with a version comment; the check requires one such pin per action"
uses = ["ossf/scorecard-action", "github/codeql-action/upload-sarif"]
runs_in = "scorecard workflow: pushes to main, weekly, and branch protection changes"
config = "publish_results: true; results go to the OpenSSF API and to code scanning"
conflicts = "none known"
exceptions = "none"
runtime = "not yet recorded; the workflow is new"
findings = "unknown: the first run publishes the baseline; record low checks at the next review"
replaces = "none"
checked = 2026-10-30
